# Scene filter for AlpaSim-exported logs (tools/navsim_from_alpasim).
# Simulated logs carry no nuPlan route (roadblock_ids is always empty) and
# no official scenario-token list; windows are sampled densely (every frame
# with full history+future context becomes a sample).
_target_: navsim.common.dataclasses.SceneFilter
_convert_: 'all'

num_history_frames: 4
num_future_frames: 10
frame_interval: 1
has_route: false

max_scenes: null
log_names: null
tokens: null
