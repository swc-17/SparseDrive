# NAVSIM navtest det+map+TL for the 16x16 TL+DN run (latest synced iter).
name: sd_navsim_stage1_tl_dn_navtest_eval
model_identifier: other.eval.sparsedrive.navsim.v1

cluster_resources:
  num_gpus: 8
  gpu_machine_type: a100.8
  preemptible: never
  customer_resource: research
  allowed_regions:
    - us-chicago-1

workload_variant_config:
  workload_type: generic
  entrypoint_fn: lilypad_entrypoint_navsim_detmap.detmap_entrypoint_fn
  entrypoint_fn_config:
    run_name: "navsim_stage1_tl_16x16_dn_map5_navtest_iter10860"
    train_run_name: "navsim_stage1_tl_16x16_dn_map5"
    checkpoint_s3: "s3://research-datasets-chicago/users/tejan/navsim/sparsedrive/work_dirs/navsim_stage1_tl_16x16_dn_map5/iter_10860.pth"
    eval_s3_prefix: "users/tejan/navsim/sparsedrive/work_dirs/navsim_stage1_tl_16x16_dn_map5_navtest_iter10860"
    config_file: "projects/configs/navsim/sparsedrive_navsim_stage1_tl_dn_navtest_eval.py"
    infos_s3: "s3://research-datasets-chicago/users/tejan/navsim/sparsedrive/data/infos/navsim_infos_navtest_tl.pkl"
    frame_tars_s3: "s3://research-datasets-chicago/users/tejan/navsim/sparsedrive/eval_frames/navtest_eval_frames/"
    num_gpus: 8
    torch_cuda_arch_list: "8.0"
    eval_samples_per_gpu: 1
    stage_files:
      - [data/kmeans/navtrain/kmeans_det_900_navsim.npy, data/kmeans/kmeans_det_900_navsim.npy]
      - [data/kmeans/navtrain/kmeans_map_100_navsim_tl.npy, data/kmeans/kmeans_map_100_navsim_tl.npy]

  experiment_tracking_values:
    wandb_values:
      entity: research
      project: sparsedrive-navsim

runtime_environment:
  code_assets:
    root_directory: /home/tejan/lwm-rl/SparseDrive
    pip_requirements_path: requirements_lilypad.txt
    max_file_size_mb: 50
    regex_excludes:
      - "^/\\.git"
      - "/__pycache__/"
      - "\\.egg-info/"
      - "\\.so$"
      - "\\.pyc$"
      - "\\.pth$"
      - "\\.pkl$"
      - "\\.tar$"
      - "\\.tar\\.gz$"
      - "\\.log$"
      - "\\.png$"
      - "\\.jpg$"
      - "\\.mp4$"
      - "^/data/"
      - "^/ckpt"
      - "^/work_dirs/"
      - "^/wandb/"
      - "^/vis/"
      - "^/logs/"
      - "^/lilypad_logs/"
      - "^/docs/"
      - "^/assets/"

  required_environment_variables:
    - WANDB_API_KEY
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY

  constant_environment_variables:
    AWS_ENDPOINT_URL: "https://idskhu5vqvtl.compat.objectstorage.us-chicago-1.oraclecloud.com"
    AWS_ENDPOINT_URL_S3: "https://idskhu5vqvtl.compat.objectstorage.us-chicago-1.oraclecloud.com"
    AWS_DEFAULT_REGION: "us-chicago-1"
    AWS_REGION: "us-chicago-1"
    AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
    AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
    WANDB_BASE_URL: "https://appliedintuition.wandb.io"
    PYTHONUNBUFFERED: "1"
    TORCH_CUDA_ARCH_LIST: "8.0"
    PATH: /usr/local/cuda/bin:$PATH
    LD_LIBRARY_PATH: /usr/local/cuda/lib64:$LD_LIBRARY_PATH
