name: sparsedrive_b2d_stage1_tl_dn_eval
model_identifier: other.eval.sparsedrive.bench2drive.v1

cluster_resources:
  num_gpus: 8
  gpu_machine_type: a100.8
  preemptible: never
  customer_resource: research
  allowed_regions:
    - us-chicago-1

workload_variant_config:
  workload_type: generic
  entrypoint_fn: lilypad_entrypoint_b2d.eval_entrypoint_fn
  entrypoint_fn_config:
    run_name: "b2d_stage1_tl_dn_a100x16_bs16_eval_iter18340"
    train_run_name: "b2d_stage1_tl_dn_a100x16_bs16"
    config_file: "projects/configs/b2d/sparsedrive_b2d_stage1_tl_dn.py"
    checkpoint_s3: "s3://research-datasets-chicago/users/tejan/sparsedrive_b2d/work_dirs/b2d_stage1_tl_dn_a100x16_bs16/iter_18340.pth"
    num_gpus: 8
    torch_cuda_arch_list: "8.0"
    stage_threads: 12
    eval_metrics: ["bbox", "map"]
    eval_samples_per_gpu: 1

  experiment_tracking_values:
    wandb_values:
      entity: research
      project: sparsedrive-b2d

runtime_environment:
  code_assets:
    root_directory: /home/tejan/lwm-rl/SparseDrive
    pip_requirements_path: requirements_lilypad.txt
    max_file_size_mb: 50
    regex_excludes:
      - "^/\\.git"
      - "/__pycache__/"
      - "\\.egg-info/"
      - "\\.so$"
      - "\\.pyc$"
      - "\\.pth$"
      - "\\.pkl$"
      - "\\.tar$"
      - "\\.tar\\.gz$"
      - "\\.log$"
      - "\\.png$"
      - "\\.jpg$"
      - "\\.mp4$"
      - "^/data/"
      - "^/ckpt"
      - "^/work_dirs/"
      - "^/wandb/"
      - "^/vis/"
      - "^/logs/"
      - "^/lilypad_logs/"
      - "^/docs/"
      - "^/assets/"

  required_environment_variables:
    - WANDB_API_KEY
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY

  constant_environment_variables:
    AWS_ENDPOINT_URL: "https://idskhu5vqvtl.compat.objectstorage.us-chicago-1.oraclecloud.com"
    AWS_ENDPOINT_URL_S3: "https://idskhu5vqvtl.compat.objectstorage.us-chicago-1.oraclecloud.com"
    AWS_DEFAULT_REGION: "us-chicago-1"
    AWS_REGION: "us-chicago-1"
    AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
    AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
    WANDB_BASE_URL: "https://appliedintuition.wandb.io"
    PYTHONUNBUFFERED: "1"
    B2D_VERSION: "trainval"
    B2D_TRAIN_SAMPLES: "234769"
    B2D_NUM_GPUS: "8"
    B2D_SAMPLES_PER_GPU: "4"
    B2D_DATA_ROOT: "data/bench2drive/"
    B2D_INFO_ROOT: "data/infos/"
    B2D_KMEANS_ROOT: "data/kmeans/"
    B2D_RESNET50_CHECKPOINT: "ckpt/resnet50-19c8e357.pth"
    B2D_USE_DEFORMABLE_FUNC: "1"
    WANDB_NAME: "b2d_stage1_tl_dn_a100x16_bs16_eval_iter18340"
    TORCH_CUDA_ARCH_LIST: "8.0"
